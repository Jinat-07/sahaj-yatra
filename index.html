<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sahaj Yatra - সহজ যাতায়াত</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header class="main-header">
        <div class="logo">
            <i class="fas fa-bus-alt"></i>
            <span data-lang="appName">Sahaj Yatra</span>
        </div>
        <div class="header-actions">
            <i class="fas fa-language" onclick="toggleLanguage()"></i>
            <i class="fas fa-moon" onclick="toggleDarkMode()" id="theme-icon"></i>
            <div class="notif-icon" onclick="toggleNoticeBoard()">
                <i class="fas fa-bell"></i>
                <span id="notice-dot" class="dot"></span>
            </div>
        </div>
    </header>

    <main class="screen-container">
        <section id="screen-home" class="screen active">
            <div class="search-container">
                <div class="input-group">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="start-node" placeholder="কোথা থেকে?">
                </div>
                <div class="input-group">
                    <i class="fas fa-location-arrow"></i>
                    <input type="text" id="end-node" placeholder="কোথায় যাবেন?">
                </div>
                <button id="search-btn" onclick="searchBuses()">
                    <span data-lang="searchBtn">বাস খুঁজুন</span>
                </button>
            </div>
            
            <div id="result-area" class="results-grid"></div>
        </section>

        <section id="screen-profile" class="screen">
            <div id="auth-ui" class="auth-card">
                <div id="login-form">
                    <h3 data-lang="loginTitle">লগইন করুন</h3>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="l-email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="l-pass" placeholder="Password">
                    </div>
                    <button onclick="handleLogin()" class="primary-btn">
                        <span data-lang="loginBtn">প্রবেশ করুন</span>
                    </button>
                    <p class="toggle-auth" onclick="toggleAuth(false)">নতুন অ্যাকাউন্ট তৈরি করুন</p>
                </div>
            </div>

            <div id="user-profile" class="profile-view hidden">
                </div>
        </section>
    </main>

    <div id="notice-board" class="notice-overlay hidden">
        <div class="notice-modal">
            <div class="modal-header">
                <h3>নোটিশ বোর্ড</h3>
                <i class="fas fa-times" onclick="toggleNoticeBoard()"></i>
            </div>
            <div id="notice-list"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('screen-home', this)">
            <i class="fas fa-search"></i>
            <span data-lang="navSearch">খুঁজুন</span>
        </div>
        <div class="nav-item" onclick="switchTab('screen-profile', this)">
            <i class="fas fa-user-circle"></i>
            <span data-lang="navProfile">প্রোফাইল</span>
        </div>
    </nav>
</div>

<script src="script.js"></script>
</body>
</html>
